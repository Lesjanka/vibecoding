
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>PyCamp — Интерактивный курс Python</title>
<script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0a23;
    --bg2: #1b1b32;
    --bg3: #2a2a40;
    --accent: #f1be32;
    --accent2: #dfd042;
    --text: #ffffff;
    --muted: #a9b4c2;
    --success: #acd157;
    --error: #e74c3c;
    --border: #3b3b4f;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
  }
  header {
    background: var(--bg2);
    padding: 12px 20px;
    border-bottom: 2px solid var(--accent);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .logo {
    font-size: 24px;
    font-weight: bold;
    color: var(--accent);
  }
  .logo span { color: var(--text); }
  .progress-bar {
    width: 200px;
    height: 12px;
    background: var(--bg3);
    border-radius: 6px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    transition: width 0.3s;
  }
  main {
    display: grid;
    grid-template-columns: 280px 1fr 1fr;
    height: calc(100vh - 60px);
  }
  .sidebar {
    background: var(--bg2);
    overflow-y: auto;
    border-right: 1px solid var(--border);
  }
  .sidebar h3 {
    padding: 15px;
    color: var(--accent);
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 1px;
    border-bottom: 1px solid var(--border);
  }
  .lesson-item {
    padding: 12px 15px;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
    transition: background 0.2s;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .lesson-item:hover { background: var(--bg3); }
  .lesson-item.active { background: var(--bg3); border-left: 3px solid var(--accent); }
  .lesson-item.completed::before {
    content: "✓";
    color: var(--success);
    font-weight: bold;
  }
  .lesson-item:not(.completed)::before {
    content: "○";
    color: var(--muted);
  }
  .lesson-content {
    overflow-y: auto;
    padding: 30px;
    background: var(--bg);
  }
  .lesson-content h1 {
    color: var(--accent);
    margin-bottom: 20px;
    font-size: 28px;
  }
  .lesson-content h2 {
    color: var(--accent2);
    margin: 20px 0 10px;
    font-size: 20px;
  }
  .lesson-content p, .lesson-content li {
    line-height: 1.7;
    margin-bottom: 12px;
    color: var(--text);
  }
  .lesson-content ul, .lesson-content ol {
    margin-left: 25px;
    margin-bottom: 15px;
  }
  .lesson-content code {
    background: var(--bg3);
    padding: 2px 6px;
    border-radius: 4px;
    color: var(--accent2);
    font-family: "Courier New", monospace;
  }
  .lesson-content pre {
    background: var(--bg2);
    padding: 15px;
    border-radius: 6px;
    overflow-x: auto;
    margin: 15px 0;
    border-left: 3px solid var(--accent);
  }
  .lesson-content pre code {
    background: transparent;
    padding: 0;
    color: var(--text);
  }
  .task-box {
    background: var(--bg2);
    border: 2px solid var(--accent);
    border-radius: 8px;
    padding: 20px;
    margin: 25px 0;
  }
  .task-box h3 {
    color: var(--accent);
    margin-bottom: 10px;
  }
  .editor-panel {
    background: var(--bg2);
    display: flex;
    flex-direction: column;
    border-left: 1px solid var(--border);
  }
  .editor-header {
    padding: 10px 15px;
    background: var(--bg3);
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .editor-header span {
    color: var(--accent);
    font-weight: bold;
    font-size: 13px;
    text-transform: uppercase;
  }
  .editor-tabs {
    display: flex;
    gap: 5px;
  }
  .tab-btn {
    background: var(--bg2);
    color: var(--muted);
    border: none;
    padding: 5px 12px;
    cursor: pointer;
    font-size: 12px;
    border-radius: 4px;
  }
  .tab-btn.active {
    background: var(--accent);
    color: var(--bg);
  }
  #codeEditor {
    flex: 1;
    background: var(--bg);
    color: var(--text);
    border: none;
    padding: 15px;
    font-family: "Courier New", monospace;
    font-size: 14px;
    resize: none;
    outline: none;
    line-height: 1.5;
    tab-size: 4;
  }
  .actions {
    padding: 10px 15px;
    background: var(--bg3);
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
  }
  button {
    background: var(--accent);
    color: var(--bg);
    border: none;
    padding: 10px 20px;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
    font-size: 14px;
    transition: background 0.2s;
  }
  button:hover { background: var(--accent2); }
  button.secondary {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent);
  }
  button.secondary:hover { background: var(--accent); color: var(--bg); }
  .output-panel {
    background: #000;
    padding: 10px 15px;
    max-height: 180px;
    overflow-y: auto;
    font-family: "Courier New", monospace;
    font-size: 13px;
    border-top: 1px solid var(--border);
  }
  .output-line { margin: 2px 0; }
  .output-line.error { color: var(--error); }
  .output-line.success { color: var(--success); }
  .output-line.info { color: var(--muted); }
  .loading {
    position: fixed;
    inset: 0;
    background: rgba(10,10,35,0.95);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 1000;
  }
  .spinner {
    width: 60px;
    height: 60px;
    border: 4px solid var(--bg3);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading p {
    margin-top: 20px;
    color: var(--accent);
    font-size: 18px;
  }
  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg2); }
  ::-webkit-scrollbar-thumb { background: var(--bg3); border-radius: 5px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent); }
</style>
</head>
<body>

<div class="loading" id="loading">
  <div class="spinner"></div>
  <p>Загрузка Python-интерпретатора...</p>
  <p style="font-size:13px;color:var(--muted);margin-top:10px;">Это может занять несколько секунд</p>
</div>

<header>
  <div class="logo">Py<span>Camp</span></div>
  <div style="display:flex;align-items:center;gap:15px;">
    <span id="progressText" style="font-size:13px;color:var(--muted);">0 / 0</span>
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  </div>
</header>

<main>
  <aside class="sidebar">
    <h3>📚 Программа курса</h3>
    <div id="lessonList"></div>
  </aside>

  <section class="lesson-content" id="lessonContent"></section>

  <section class="editor-panel">
    <div class="editor-header">
      <span>Редактор кода</span>
      <div class="editor-tabs">
        <button class="tab-btn active" onclick="switchTab('code')">Код</button>
        <button class="tab-btn" onclick="switchTab('hint')">Подсказка</button>
      </div>
    </div>
    <textarea id="codeEditor" spellcheck="false"></textarea>
    <div class="output-panel" id="outputPanel"></div>
    <div class="actions">
      <button onclick="runCode()">▶ Запустить</button>
      <button onclick="checkSolution()" class="secondary">✓ Проверить</button>
      <button onclick="resetCode()" class="secondary">↺ Сброс</button>
    </div>
  </section>
</main>

<script>
const lessons = [
  {
    title: "Введение в Python",
    content: `
      <h1>Введение в Python</h1>
      <p>Python — один из самых популярных языков программирования в мире. Он известен своим простым и читаемым синтаксисом, что делает его идеальным для начинающих.</p>
      <h2>Где используется Python?</h2>
      <ul>
        <li>Веб-разработка (Django, Flask)</li>
        <li>Анализ данных и машинное обучение (Pandas, NumPy, TensorFlow)</li>
        <li>Автоматизация задач</li>
        <li>Научные вычисления</li>
        <li>Разработка игр</li>
      </ul>
      <h2>Ваша первая программа</h2>
      <p>Традиционно изучение любого языка начинают с программы <code>Hello, World!</code>. В Python это делается одной строкой:</p>
      <pre><code>print("Hello, World!")</code></pre>
      <p>Функция <code>print()</code> выводит текст на экран.</p>
      <div class="task-box">
        <h3>🎯 Задание</h3>
        <p>Напишите программу, которая выводит на экран: <code>Hello, Python!</code></p>
      </div>
    `,
    starter: '# Напишите ваш код здесь\n',
    hint: 'Используйте функцию print() с текстом "Hello, Python!" в кавычках',
    test: `
output = _get_output()
assert "Hello, Python!" in output, "Ожидалось: Hello, Python!"
`
  },
  {
    title: "Переменные и типы данных",
    content: `
      <h1>Переменные и типы данных</h1>
      <p>Переменная — это именованная ячейка памяти для хранения данных. В Python не нужно указывать тип переменной — он определяется автоматически.</p>
      <h2>Создание переменных</h2>
      <pre><code>name = "Alice"
age = 25
height = 1.68
is_student = True</code></pre>
      <h2>Основные типы данных</h2>
      <ul>
        <li><code>int</code> — целые числа: <code>42</code>, <code>-7</code></li>
        <li><code>float</code> — дробные числа: <code>3.14</code>, <code>-0.5</code></li>
        <li><code>str</code> — строки: <code>"привет"</code></li>
        <li><code>bool</code> — логический тип: <code>True</code> или <code>False</code></li>
      </ul>
      <h2>Проверка типа</h2>
      <p>Функция <code>type()</code> возвращает тип объекта:</p>
      <pre><code>x = 10
print(type(x))  # &lt;class 'int'&gt;</code></pre>
      <div class="task-box">
        <h3>🎯 Задание</h3>
        <p>Создайте переменную <code>my_number</code> со значением <code>42</code> и выведите её тип с помощью <code>print(type(my_number))</code></p>
      </div>
    `,
    starter: '# Создайте переменную my_number и выведите её тип\n',
    hint: 'my_number = 42\nprint(type(my_number))',
    test: `
assert "my_number" in _get_code(), "Переменная my_number не найдена"
output = _get_output()
assert "<class 'int'>" in output, "Ожидалось вывести тип int"
`
  },
  {
    title: "Числа и арифметика",
    content: `
      <h1>Числа и арифметические операции</h1>
      <p>Python поддерживает все стандартные математические операции.</p>
      <h2>Операторы</h2>
      <ul>
        <li><code>+</code> — сложение</li>
        <li><code>-</code> — вычитание</li>
        <li><code>*</code> — умножение</li>
        <li><code>/</code> — деление (возвращает float)</li>
        <li><code>//</code> — целочисленное деление</li>
        <li><code>%</code> — остаток от деления</li>
        <li><code>**</code> — возведение в степень</li>
      </ul>
      <h2>Примеры</h2>
      <pre><code>a = 10
b = 3
print(a + b)   # 13
print(a / b)   # 3.333...
print(a // b)  # 3
print(a % b)   # 1
print(a ** b)  # 1000</code></pre>
      <div class="task-box">
        <h3>🎯 Задание</h3>
        <p>Вычислите и выведите результат: <code>17</code> в степени <code>2</code>, а затем остаток от деления <code>17</code> на <code>5</code>. Каждое значение на отдельной строке.</p>
      </div>
    `,
    starter: '# Вычислите 17**2 и 17%5\n',
    hint: 'print(17 ** 2)\nprint(17 % 5)',
    test: `
output = _get_output()
lines = [l.strip() for l in output.strip().split('\\n') if l.strip()]
assert "289" in lines[0], "Ожидалось 289 в первой строке"
assert "2" in lines[1], "Ожидалось 2 во второй строке"
`
  },
  {
    title: "Строки",
    content: `
      <h1>Работа со строками</h1>
      <p>Строки — это последовательности символов. В Python они создаются с помощью кавычек.</p>
      <h2>Создание строк</h2>
      <pre><code>s1 = "Привет"
s2 = 'Мир'
s3 = """Многострочная
строка"""</code></pre>
      <h2>Операции со строками</h2>
      <pre><code># Конкатенация (сложение)
s = "Hello" + " " + "World"  # "Hello World"

# Повторение
s = "Ha" * 3  # "HaHaHa"

# Длина строки
len("Python")  # 6</code></pre>
      <h2>Индексация и срезы</h2>
      <pre><code>s = "Python"
print(s[0])     # 'P' (первый символ)
print(s[-1])    # 'n' (последний)
print(s[0:3])   # 'Pyt' (срез с 0 по 2)
print(s[::-1])  # 'nohtyP' (разворот)</code></pre>
      <h2>f-строки (форматирование)</h2>
      <pre><code>name = "Аня"
age = 20
print(f"Меня зовут {name}, мне {age} лет")</code></pre>
      <div class="task-box">
        <h3>🎯 Задание</h3>
        <p>Создайте переменные <code>first_name</code> = "Иван" и <code>last_name</code> = "Петров". Выведите с помощью f-строки: <code>Имя: Иван Петров</code></p>
      </div>
    `,
    starter: '# Создайте переменные и используйте f-строку\n',
    hint: 'first_name = "Иван"\nlast_name = "Петров"\nprint(f"Имя: {first_name} {last_name}")',
    test: `
output = _get_output().strip()
assert "Имя: Иван Петров" in output, "Ожидалось: Имя: Иван Петров"
`
  },
  {
    title: "Ввод данных",
    content: `
      <h1>Ввод данных от пользователя</h1>
      <p>Функция <code>input()</code> позволяет получить данные от пользователя. Она всегда возвращает строку.</p>
      <h2>Пример</h2>
      <pre><code>name = input("Как вас зовут? ")
print("Привет, " + name)</code></pre>
      <h2>Преобразование типов</h2>
      <p>Поскольку <code>input()</code> возвращает строку, для работы с числами нужно преобразование:</p>
      <pre><code>age = int(input("Ваш возраст: "))
price = float(input("Цена: "))</code></pre>
      <h2>Функции преобразования</h2>
      <ul>
        <li><code>int(x)</code> — в целое число</li>
        <li><code>float(x)</code> — в дробное число</li>
        <li><code>str(x)</code> — в строку</li>
      </ul>
      <div class="task-box">
        <h3>🎯 Задание</h3>
        <p>Напишите программу, которая использует <code>input()</code> для запроса имени, а затем выводит <code>Привет, [имя]!</code> (где [имя] — введённое значение).<br>
        <em>Примечание: при проверке тест сам передаст имя "Мир" в input()</em></p>
      </div>
    `,
    starter: '# Запросите имя и поприветствуйте пользователя\nname = input("Имя: ")\n',
    hint: 'name = input("Имя: ")\nprint(f"Привет, {name}!")',
    test: `
import io, sys
sys.stdin = io.StringIO("Мир\\n")
exec(_get_code())
output = _get_output()
assert "Привет, Мир!" in output, "Ожидалось: Привет, Мир!"
`
  },
  {
    title: "Условные конструкции",
    content: `
      <h1>Условные конструкции if/elif/else</h1>
      <p>Условные операторы позволяют выполнять разный код в зависимости от условий.</p>
      <h2>Синтаксис</h2>
      <pre><code>age = 18
if age >= 18:
    print("Совершеннолетний")
elif age >= 14:
    print("Подросток")
else:
    print("Ребёнок")</code></pre>
      <h2>Операторы сравнения</h2>
      <ul>
        <li><code>==</code> — равно</li>
        <li><code>!=</code> — не равно</li>
        <li><code>&gt;</code>, <code>&lt;</code>, <code>&gt;=</code>, <code>&lt;=</code></li>
      </ul>
      <h2>Логические операторы</h2>
      <pre><code>x = 10
if x > 0 and x < 100:
    print("Двузначное положительное")

if x == 0 or x == 1:
    print("Ноль или единица")

if not x < 0:
    print("Не отрицательное")</code></pre>
      <div class="task-box">
        <h3>🎯 Задание</h3>
        <p>Создайте переменную <code>number = 15</code>. Напишите условие: если число чётное — выведите <code>Чётное</code>, иначе — <code>Нечётное</code>.</p>
      </div>
    `,
    starter: 'number = 15\n# Напишите условие\n',
    hint: 'if number % 2 == 0:\n    print("Чётное")\nelse:\n    print("Нечётное")',
    test: `
output = _get_output().strip()
assert output == "Нечётное", f"Ожидалось 'Нечётное', получено '{output}'"
`
  },
  {
    title: "Цикл while",
    content: `
      <h1>Цикл while</h1>
      <p>Цикл <code>while</code> выполняет код, пока условие истинно.</p>
      <h2>Пример</h2>
      <pre><code>i = 1
while i <= 5:
    print(i)
    i += 1  # Важно: увеличиваем i, иначе бесконечный цикл!</code></pre>
      <h2>Операторы break и continue</h2>
      <pre><code># break — прерывает цикл
i = 0
while True:
    if i == 5:
        break
    print(i)
    i += 1

# continue — переходит к следующей итерации
i = 0
while i < 10:
    i += 1
    if i % 2 == 0:
        continue
    print(i)  # Выведет только нечётные</code></pre>
      <div class="task-box">
        <h3>🎯 Задание</h3>
        <p>С помощью цикла <code>while</code> выведите числа от <code>1</code> до <code>10</code>, каждое на новой строке.</p>
      </div>
    `,
    starter: '# Выведите числа от 1 до 10 через while\n',
    hint: 'i = 1\nwhile i <= 10:\n    print(i)\n    i += 1',
    test: `
output = _get_output().strip().split('\\n')
expected = [str(i) for i in range(1, 11)]
assert output == expected, f"Ожидалось {expected}, получено {output}"
`
  },
  {
    title: "Цикл for",
    content: `
      <h1>Цикл for</h1>
      <p>Цикл <code>for</code> перебирает элементы последовательности.</p>
      <h2>Функция range()</h2>
      <pre><code># range(stop) — от 0 до stop-1
for i in range(5):
    print(i)  # 0, 1, 2, 3, 4

# range(start, stop)
for i in range(1, 6):
    print(i)  # 1, 2, 3, 4, 5

# range(start, stop, step)
for i in range(0, 10, 2):
    print(i)  # 0, 2, 4, 6, 8</code></pre>
      <h2>Перебор строки</h2>
      <pre><code>for char in "Python":
    print(char)</code></pre>
      <div class="task-box">
        <h3>🎯 Задание</h3>
        <p>С помощью цикла <code>for</code> и <code>range()</code> выведите сумму чисел от <code>1</code> до <code>100</code> (включительно). Выведите только итоговое число.</p>
      </div>
    `,
    starter: '# Вычислите сумму чисел от 1 до 100\n',

for num in countdown(5):

      <pre><code>import time

def timer(func):

let currentLesson = 0;
let completedLessons = new Set();
let pyodide = null;
let capturedOutput = "";
let currentCode = "";

// Загрузка Pyodide
async function initPyodide() {
  try {
    pyodide = await loadPyodide();
    document.getElementById('loading').style.display = 'none';
    renderLessonList();
    loadLesson(0);
    updateProgress();
  } catch (e) {
    document.getElementById('loading').innerHTML = 
      `<p style="color:var(--error)">Ошибка загрузки: ${e.message}</p>
       <button onclick="location.reload()">Попробовать снова</button>`;
  }
}

function renderLessonList() {
  const list = document.getElementById('lessonList');
  list.innerHTML = '';
  lessons.forEach((lesson, i) => {
    const item = document.createElement('div');
    item.className = 'lesson-item';
    if (i === currentLesson) item.classList.add('active');
    if (completedLessons.has(i)) item.classList.add('completed');
    item.textContent = `${i + 1}. ${lesson.title}`;
    item.onclick = () => loadLesson(i);
    list.appendChild(item);
  });
}

function loadLesson(index) {
  currentLesson = index;
  const lesson = lessons[index];
  document.getElementById('lessonContent').innerHTML = lesson.content;
  document.getElementById('codeEditor').value = lesson.starter;
  document.getElementById('outputPanel').innerHTML = '<div class="output-line info">Готов к запуску...</div>';
  renderLessonList();
}

function resetCode() {
  document.getElementById('codeEditor').value = lessons[currentLesson].starter;
}

function switchTab(tab) {
  const editor = document.getElementById('codeEditor');
  const btns = document.querySelectorAll('.tab-btn');
  btns.forEach(b => b.classList.remove('active'));
  if (tab === 'hint') {
    btns[1].classList.add('active');
    editor.value = lessons[currentLesson].hint;
    editor.readOnly = true;
  } else {
    btns[0].classList.add('active');
    editor.readOnly = false;
    editor.value = lessons[currentLesson].starter;
  }
}

function _get_output() { return capturedOutput; }
function _get_code() { return currentCode; }

async function runCode() {
  if (!pyodide) return;
  const code = document.getElementById('codeEditor').value;
  currentCode = code;
  const output = document.getElementById('outputPanel');
  output.innerHTML = '<div class="output-line info">▶ Выполнение...</div>';
  
  try {
    pyodide.runPython(`
import sys, io
_sys_out = io.StringIO()
_sys_err = io.StringIO()
sys.stdout = _sys_out
sys.stderr = _sys_err
`);
    await pyodide.runPythonAsync(code);
    capturedOutput = pyodide.runPython('_sys_out.getvalue()');
    const errOutput = pyodide.runPython('_sys_err.getvalue()');
    
    let html = '';
    if (capturedOutput) {
      capturedOutput.split('\n').forEach(line => {
        if (line) html += `<div class="output-line">${escapeHtml(line)}</div>`;
      });
    }
    if (errOutput) {
      html += `<div class="output-line error">${escapeHtml(errOutput)}</div>`;
    }
    if (!html) html = '<div class="output-line info">✓ Код выполнен (нет вывода)</div>';
    output.innerHTML = html;
  } catch (e) {
    output.innerHTML = `<div class="output-line error">❌ ${escapeHtml(e.message)}</div>`;
    capturedOutput = "";
  }
}

async function checkSolution() {
  if (!pyodide) return;
  const code = document.getElementById('codeEditor').value;
  currentCode = code;
  const output = document.getElementById('outputPanel');
  output.innerHTML = '<div class="output-line info">🔍 Проверка решения...</div>';
  
  try {
    pyodide.runPython(`
import sys, io
_sys_out = io.StringIO()
sys.stdout = _sys_out
`);
    await pyodide.runPythonAsync(code);
    capturedOutput = pyodide.runPython('_sys_out.getvalue()');
    
    pyodide.registerJsFunction({
      getOutput: () => capturedOutput,
      getCode: () => currentCode
    }, '_js_helper');
    
    pyodide.runPython(`
def _get_output():
    return _js_helper.getOutput()
def _get_code():
    return _js_helper.getCode()
`);
    
    await pyodide.runPythonAsync(lessons[currentLesson].test);
    
    output.innerHTML = `
      <div class="output-line success">✅ Отлично! Задание выполнено верно!</div>
      <div class="output-line info">Вывод программы:</div>
      ${capturedOutput.split('\n').filter(l=>l).map(l => `<div class="output-line">${escapeHtml(l)}</div>`).join('')}
    `;
    
    completedLessons.add(currentLesson);
    saveProgress();
    updateProgress();
    renderLessonList();
    
    if (currentLesson < lessons.length - 1) {
      setTimeout(() => {
        if (confirm('🎉 Отлично! Перейти к следующему уроку?')) {
          loadLesson(currentLesson + 1);
        }
      }, 500);
    } else {
      setTimeout(() => {
        alert('🏆 Поздравляем! Вы прошли весь курс Python!');
      }, 500);
    }
  } catch (e) {
    let msg = e.message;
    if (msg.includes('AssertionError') || msg.includes('assert')) {
      const match = msg.match(/Ожидалось[^"]*"([^"]+)"/);
      const hint = match ? match[1] : 'Проверьте вывод программы';
      output.innerHTML = `<div class="output-line error">❌ Неверно: ${escapeHtml(hint)}</div>
        <div class="output-line info">Попробуйте ещё раз!</div>`;
    } else {
      output.innerHTML = `<div class="output-line error">❌ Ошибка: ${escapeHtml(msg)}</div>`;
    }
  }
}

function updateProgress() {
  const total = lessons.length;
  const done = completedLessons.size;
  document.getElementById('progressText').textContent = `${done} / ${total}`;
  document.getElementById('progressFill').style.width = `${(done/total)*100}%`;
}

function saveProgress() {
  try {
    localStorage.setItem('pycamp_completed', JSON.stringify([...completedLessons]));
  } catch(e) {}
}

function loadProgress() {
  try {
    const saved = localStorage.getItem('pycamp_completed');
    if (saved) completedLessons = new Set(JSON.parse(saved));
  } catch(e) {}
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Tab в textarea
document.getElementById('codeEditor').addEventListener('keydown', function(e) {
  if (e.key === 'Tab') {
    e.preventDefault();
    const start = this.selectionStart;
    const end = this.selectionEnd;
    this.value = this.value.substring(0, start) + '    ' + this.value.substring(end);
    this.selectionStart = this.selectionEnd = start + 4;
  }
});

loadProgress();
initPyodide();
</script>

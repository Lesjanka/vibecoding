<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Навигация</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #1e2228;
            color: #c9d1d9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background-color: #252a32;
            border-radius: 12px;
            border: 1px solid #363d47;
            overflow: hidden;
        }

        .header {
            padding: 20px 24px;
            border-bottom: 1px solid #363d47;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 600;
            color: #e6edf3;
        }

        .file-list {
            list-style: none;
        }

        .file-list li {
            border-bottom: 1px solid #363d47;
        }

        .file-list li:last-child {
            border-bottom: none;
        }

        .file-list a {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            text-decoration: none;
            color: #c9d1d9;
            transition: background-color 0.15s ease;
        }

        .file-list a:hover {
            background-color: #2d333b;
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .file-icon {
            width: 20px;
            height: 24px;
            border: 1.5px solid #8b949e;
            border-radius: 3px;
            position: relative;
            flex-shrink: 0;
        }

        .file-icon::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 6px;
            height: 6px;
            background-color: #252a32;
            border-bottom: 1.5px solid #8b949e;
            border-left: 1.5px solid #8b949e;
        }

        .file-name {
            font-size: 15px;
            font-weight: 500;
        }

        .file-time {
            font-size: 13px;
            color: #8b949e;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📁 Проекты</h1>
        </div>
        <ul class="file-list">
            <li>
                <a href="cursor.html">
                    <div class="file-info">
                        <div class="file-icon"></div>
                        <span class="file-name">cursor.html</span>
                    </div>
                    <span class="file-time">2 минуты назад</span>
                </a>
            </li>
            <li>
                <a href="jirmaxsing.html">
                    <div class="file-info">
                        <div class="file-icon"></div>
                        <span class="file-name">jirmaxsing.html</span>
                    </div>
                    <span class="file-time">12 часов назад</span>
                </a>
            </li>
            <li>
                <a href="lookmaksing.html">
                    <div class="file-info">
                        <div class="file-icon"></div>
                        <span class="file-name">lookmaksing.html</span>
                    </div>
                    <span class="file-time">12 часов назад</span>
                </a>
            </li>
            <li>
                <a href="qwen_agent007.html">
                    <div class="file-info">
                        <div class="file-icon"></div>
                        <span class="file-name">qwen_agent007.html</span>
                    </div>
                    <span class="file-time">11 часов назад</span>
                </a>
            </li>
            <li>
                <a href="qwen_web.html">
                    <div class="file-info">
                        <div class="file-icon"></div>
                        <span class="file-name">qwen_web.html</span>
                    </div>
                    <span class="file-time">11 часов назад</span>
                </a>
            </li>
        </ul>
    </div>
</body>
</html>

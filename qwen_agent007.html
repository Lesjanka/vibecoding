/* ==================== LESSON NAV ==================== */
function lessonNavHtml(id){
  const idx = ALL_ITEMS.findIndex(i => i.id === id);
  const prev = ALL_ITEMS[idx - 1], next = ALL_ITEMS[idx + 1];
  return `<div class="lesson-nav no-print">
    <button ${prev ? "" : "disabled"} onclick="goItem('${prev ? prev.id : ""}')">← ${prev ? prev.title : "Начало"}</button>
    <button ${next ? "" : "disabled"} onclick="goItem('${next ? next.id : ""}')">${next ? next.title : "Курс пройден 🎉"} →</button>
  </div>`;
}
function goItem(id){ if (!id) { state.view = "welcome"; state.itemId = null; } else { const it = itemById(id); state.view = it.type; state.itemId = id; } renderMain(); }

/* ==================== MAIN RENDER ==================== */
function renderMain(){
  const c = document.getElementById("content");
  document.querySelectorAll("#topnav button").forEach(b => b.classList.toggle("active",
    (b.dataset.view === "curriculum" && state.view !== "playground" && state.view !== "certificate") ||
    b.dataset.view === state.view));
  renderSidebar();
  if (state.view === "welcome") c.innerHTML = welcomeHtml();
  else if (state.view === "playground") renderPlayground(c);
  else if (state.view === "certificate") c.innerHTML = certificateHtml();
  else if (state.view === "quiz") renderQuiz(c, itemById(state.itemId));
  else renderLesson(c, itemById(state.itemId));
  highlightAll();
  window.scrollTo(0, 0);
}

  }

      <div class="editor-card no-print">
        <div class="editor-head"><span>📝 Редактор кода — solution.py</span><span class="dots"><i style="background:#ff5f56"></i><i style="background:#ffbd2e"></i><i style="background:#27c93f"></i></span></div>
        <textarea id="codeEditor" spellcheck="false">${esc(ch.seed || "")}</textarea>
        <div class="editor-actions">
          <button class="btn btn-run" id="runBtn" onclick="checkCode('${lesson.id}')">▶ Запустить и проверить</button>
          <button class="btn btn-ghost" onclick="runOnly()">▷ Просто запустить</button>
          <button class="btn btn-ghost" onclick="showHint('${lesson.id}')">💡 Подсказка</button>

function setConsole(html){ const el = document.getElementById("consoleOut"); if (el) el.innerHTML = html; }
async function runOnly(){
  const code = document.getElementById("codeEditor").value;
  setConsole('<span style="color:var(--muted)">⏳ Выполняю…</span>');
  const r = await runPython(code, "");
  showRunResult(r, false);
}
async function checkCode(id){
  const lesson = itemById(id);
  const code = document.getElementById("codeEditor").value;
  const btn = document.getElementById("runBtn");
  btn.disabled = true; btn.textContent = "⏳ Проверяю…";
  setConsole('<span style="color:var(--muted)">⏳ Запускаю тесты…</span>');
  const r = await runPython(code, lesson.challenge.tests);
  btn.disabled = false; btn.textContent = "▶ Запустить и проверить";
  showRunResult(r, true, id);
}
function showRunResult(r, isCheck, id){
  let out = "";
  if (r.output) out += '<span class="out">' + esc(r.output) + "</span>";
  if (r.status === "offline"){
    setConsole(out + '<span class="err">⛔ ' + esc(r.msg) + "</span>");
    const res = document.getElementById("taskResult");
    if (isCheck && id && res && !state.done[id]){
      res.innerHTML = '<div class="quiz-result fail" style="font-size:14px">Интерпретатор Python недоступен (нужен интернет при первой загрузке).<br>Если вы уверены в решении — можно отметить урок вручную:</div>' +
        '<button class="btn btn-ghost btn-big" onclick="markDone(\'' + id + '\');renderMain()">Отметить урок пройденным вручную</button>';
    }
    return;
  }
  if (!isCheck){
    setConsole((out || '<span style="color:var(--muted)">(программа ничего не вывела)</span>') + (r.status === "error" ? '\n<span class="err">❌ ' + esc(r.msg) + "</span>" : ""));
    return;
  }
  const res = document.getElementById("taskResult");
  if (r.status === "ok"){
    setConsole((out || '<span style="color:var(--muted)">(вывода нет)</span>') + '\n<span class="ok">✅ Все тесты пройдены!</span>');
    if (res) res.innerHTML = '<div class="quiz-result pass">🎉 Задача решена! Урок засчитан.</div>';
    markDone(id);
    const lesson = itemById(id);
    const idx = ALL_ITEMS.findIndex(i => i.id === id);
    const next = ALL_ITEMS[idx + 1];
    if (next && res) res.innerHTML += `<button class="btn btn-green btn-big" onclick="goItem('${next.id}')">Следующий урок: ${next.title} →</button>`;
  } else if (r.status === "fail"){
    setConsole((out ? out + "\n" : "") + '<span class="err">❌ Тест не пройден: ' + esc(r.msg) + "</span>");
    if (res) res.innerHTML = '<div class="quiz-result fail">Пока не получилось — проверьте код и попробуйте снова 💪</div>';
  } else {
    setConsole((out ? out + "\n" : "") + '<span class="err">💥 Ошибка выполнения:\n' + esc(r.msg) + "</span>");
    if (res) res.innerHTML = '<div class="quiz-result fail">В коде ошибка — посмотрите сообщение выше 🔍</div>';
  }
}
function showHint(id){
  const lesson = itemById(id);
  setConsole('<span style="color:var(--gold)">💡 Подсказка:\n' + esc(lesson.challenge.hint.replace(/\\n/g, "\n")) + "</span>");
}
function resetCode(id){
  const lesson = itemById(id);
  document.getElementById("codeEditor").value = lesson.challenge.seed || "";
  try{ localStorage.removeItem("pycamp_code_" + id); }catch(e){}
  setConsole('<span style="color:var(--muted)">Код сброшен к начальному состоянию.</span>');
}

/* ==================== QUIZ ==================== */
function renderQuiz(c, quiz){
  const isDone = state.done[quiz.id];
  let html = `<div class="card"><div class="crumb">${quiz.sectionTitle}</div><h1>${quiz.title}</h1>
  <p>Ответьте на все вопросы. Чтобы пройти квиз, нужны <strong>все правильные ответы</strong>. После проверки вы увидите объяснения.</p>`;
  quiz.questions.forEach((q, qi) => {
    html += `<div class="q-item" id="qi-${qi}"><p class="qt">${qi+1}. ${q.q}</p>`;
    q.opts.forEach((opt, oi) => {
      html += `<label class="q-opt" id="qo-${qi}-${oi}"><input type="radio" name="q-${qi}" value="${oi}" onchange="selectOpt(${qi},${oi})"> ${opt}</label>`;
    });
    html += `<div class="q-explain" id="qe-${qi}">💡 ${q.ex}</div></div>`;
  });
  html += `<div id="quizResult"></div><button class="btn btn-run btn-big" onclick="checkQuiz('${quiz.id}')">Проверить ответы</button></div>`;
  html += lessonNavHtml(quiz.id);
  c.innerHTML = html;
}
function selectOpt(qi, oi){
  document.querySelectorAll(`[id^="qo-${qi}-"]`).forEach(l => l.classList.remove("sel"));
  document.getElementById(`qo-${qi}-${oi}`).classList.add("sel");
}
function checkQuiz(id){
  const quiz = itemById(id);
  let correct = 0;
  quiz.questions.forEach((q, qi) => {
    const item = document.getElementById("qi-" + qi);
    const sel = document.querySelector(`input[name="q-${qi}"]:checked`);
    item.classList.add("checked");
    item.classList.remove("correct", "wrong");
    if (sel && parseInt(sel.value) === q.a){ correct++; item.classList.add("correct"); }
    else { item.classList.add("wrong"); document.getElementById(`qo-${qi}-${q.a}`).style.background = "#e8f5ee"; }
  });
  const pass = correct === quiz.questions.length;
  const res = document.getElementById("quizResult");
  if (pass){
    res.innerHTML = `<div class="quiz-result pass">🎉 Отлично! ${correct}/${quiz.questions.length} — квиз пройден!</div>`;
    markDone(id);
  } else {
    res.innerHTML = `<div class="quiz-result fail">Правильных ответов: ${correct} из ${quiz.questions.length}. Нужны все! Изучите объяснения (зелёные блоки) и попробуйте снова.</div>`;
  }
  res.scrollIntoView({ behavior:"smooth", block:"center" });
}
